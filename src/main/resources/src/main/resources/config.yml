# Maximum number of effects allowed on a single line before breaking into a new line (Set to 0 to disable)
max-per-line: 5

# Line break character sequence.
# Use "\n" for standard text displays, or "<br>" if your display plugin uses MiniMessage.
line-separator: "\n"

# Divider/spacing placed between individual effect symbols on the same line
separator: " "

# Fallback format if a potion effect key is not defined in the list below
fallback-format: "<gray>[%effect_name%]</gray>"

# Custom display text/glyphs mapped to each PotionEffectType key (lowercase)
# Replace these values with your custom unicode characters (e.g., "\uE001")
effects:
  speed: "<green>\uE001</green>"
  slowness: "<red>\uE002</red>"
  haste: "<yellow>\uE003</yellow>"
  mining_fatigue: "<gray>\uE004</gray>"
  strength: "<dark_red>\uE005</dark_red>"
  instant_health: "<red>\uE006</red>"
  instant_damage: "<dark_purple>\uE007</dark_purple>"
  jump_boost: "<green>\uE008</green>"
  nausea: "<dark_green>\uE009</dark_green>"
  regeneration: "<light_purple>\uE010</light_purple>"
  resistance: "<gray>\uE011</gray>"
  fire_resistance: "<gold>\uE012</gold>"
  water_breathing: "<blue>\uE013</blue>"
  invisibility: "<white>\uE014</white>"
  blindness: "<dark_gray>\uE015</dark_gray>"
  night_vision: "<blue>\uE016</blue>"
  hunger: "<green>\uE017</green>"
  weakness: "<gray>\uE018</gray>"
  poison: "<dark_green>\uE019</dark_green>"
  wither: "<black>\uE020</black>"
  health_boost: "<red>\uE021</red>"
  absorption: "<gold>\uE022</gold>"
  saturation: "<yellow>\uE023</yellow>"
  glowing: "<gold>\uE024</gold>"
  levitation: "<white>\uE025</white>"
  luck: "<green>\uE026</green>"
  bad_luck: "<red>\uE027</red>"
  slow_falling: "<white>\uE028</white>"
  conduit_power: "<aqua>\uE029</aqua>"
  dolphins_grace: "<aqua>\uE030</aqua>"
  bad_omen: "<dark_red>\uE031</dark_red>"
  hero_of_the_village: "<green>\uE032</green>"
  darkness: "<dark_gray>\uE033</dark_gray>"
  trial_omen: "<gold>\uE034</gold>"
  raid_omen: "<red>\uE035</red>"
  wind_charged: "<white>\uE036</white>"
  weaving: "<gray>\uE037</gray>"
  oozing: "<green>\uE038</green>"
  infested: "<dark_green>\uE039</dark_green>"
