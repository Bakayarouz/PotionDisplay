name: Build and Package PotionDisplay

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package --batch-mode

      # Step A: Upload .jar as an Artifact on EVERY push/commit
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotionDisplay-latest
          path: target/*.jar

      # Step B: Create an official GitHub Release ONLY when a version tag is pushed
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          tag_name: ${{ github.ref_name }}
          name: PotionDisplay ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
